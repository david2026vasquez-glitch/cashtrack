<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <!-- Resumen de Balance, Ingresos y Gastos -->
    <section id="resumen-balance">
        <div class="tarjeta-resumen balance">
            <h3>Balance Total</h3>
            <p id="balance-total">$0.00</p>
        </div>
        <div class="resumen-detalles">
            <div class="tarjeta-resumen ingreso">
                <h4>Ingresos</h4>
                <p id="total-ingresos">+$0.00</p>
            </div>
            <div class="tarjeta-resumen gasto">
                <h4>Gastos</h4>
                <p id="total-gastos">-$0.00</p>
            </div>
        </div>
    </section>

    <h1>CashTrack - Gestor de gastos</h1>

    <form id="form-transaccion">
        <div>
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Supermercado" required>
        </div>

        <div>
            <label for="monto">Monto ($):</label>
            <input type="number" id="monto" name="monto" placeholder="Ej. 25.50" step="0.01" required>
        </div>

        <div>
            <label for="tipo">Tipo:</label>
            <select id="tipo" name="tipo" required>
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
            </select>
        </div>

        <button type="submit">Agregar Transacción</button>
    </form>

    <!-- Lista de transacciones -->
    <section id="contenedor-transacciones">
        <h2>Historial de Movimientos</h2>
        <ul id="lista-transacciones"></ul>
    </section>

    <script src="app.js"></script>
</body>
</html>
